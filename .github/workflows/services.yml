name: List German catalog

# Zum Nachschlagen, welche Dienste die API für Deutschland führt und unter
# welcher Katalog-ID – nötig, bevor man einen Anbieter in PROVIDERS aufnimmt.
# Läuft nur auf Zuruf und kostet einen einzigen Request.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Kataloge, deren Neuzugänge gezählt werden sollen (z. B. "rtl rtl.free rtl.subscription")'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Eingabe über env statt direkt in die Kommandozeile interpoliert,
      # sonst wäre der Workflow anfällig für Shell-Injection.
      - env:
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
          PROBE: ${{ inputs.probe }}
        run: npm run services -- $PROBE
